name: build

on:
  push:
    paths:
      - 'b64/**'
      - 'assets/**'
      - 'upscaled.tsv'
      - 'tools/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Udpak byggescript
        run: |
          cat b64/part1.txt b64/part2.txt b64/part3.txt b64/part4.txt b64/part5.txt b64/part6.txt > build.py.gz.b64
          base64 -d build.py.gz.b64 | gunzip > build.py
          echo "2e89ec92c0e22e37001f243ceb9114b9fa3e689ffb799c8d8e7763f73c1e531f  build.py" | sha256sum -c -

      - name: Byg sitet
        run: python3 build.py

      - name: Kopier assets ind
        run: |
          mkdir -p site/assets/css site/assets/js
          cp assets/css/style.css site/assets/css/style.css
          cp assets/js/main.js site/assets/js/main.js

      - name: Hent opskalerede billeder
        run: |
          python3 -m pip install --quiet --upgrade pillow
          python3 tools/fetch_images.py

      - name: Pak deploy.zip
        run: |
          rm -f deploy.zip
          cd site && zip -rq9 ../deploy.zip .
          cd .. && ls -lh deploy.zip && unzip -l deploy.zip | tail -3

      - name: Commit deploy.zip
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f deploy.zip
          if git diff --cached --quiet; then echo "ingen aendring"; exit 0; fi
          git commit -m "build: deploy.zip [skip ci]"
          git push
